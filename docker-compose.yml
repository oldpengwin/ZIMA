services:
  # Backend API (FastAPI). Runs pending Alembic migrations on startup —
  # see docker-entrypoint.backend.sh — so `db` only needs to exist and be
  # accepting connections, not already be migrated.
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: zima-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Explicit, not just relying on config.py's NODE_ENV fallback — this
      # is the value that actually gates production behavior (strict config
      # validation, the /auth/dev-token backdoor being disabled). Override
      # per-environment via .env; this is the safe default for `docker
      # compose up` as shipped.
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zima-network

  # Frontend — see the note at the top of Dockerfile.frontend: this is the
  # pre-rebuild frontend, not the finished product.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: zima-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - zima-network

  # Discord Bot (Node.js/discord.js, repo root — see the note at the top of
  # Dockerfile.bot about what this used to build instead).
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: zima-bot
    restart: unless-stopped
    # Was `src/bot/.env`, a path that doesn't exist — the bot reads its
    # config from the repo-root .env, same file the API uses (they're two
    # processes against one shared config surface, see .env.example).
    env_file: .env
    networks:
      - zima-network

  # Database
  db:
    image: postgres:16-alpine
    container_name: zima-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zima}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zima_password}
      POSTGRES_DB: ${POSTGRES_DB:-zima}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host by default — the API/bot reach it over the
    # compose network by service name (`db`). Uncomment only for local
    # debugging with an external DB client; a database port open on the
    # host is unnecessary attack surface in anything resembling production.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zima} -d ${POSTGRES_DB:-zima}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - zima-network

  # PGAdmin — dev convenience only. `docker compose up` (no profile) does
  # NOT start this; run `docker compose --profile dev up` to include it.
  pgadmin:
    image: dpage/pgadmin4
    container_name: zima-pgadmin
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_password}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - zima-network

volumes:
  postgres_data:

networks:
  zima-network:
    driver: bridge
