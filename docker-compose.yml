version: '3.8'

services:
  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: zima-api
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - zima-network

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: zima-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - zima-network

  # Discord Bot
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: zima-bot
    restart: unless-stopped
    env_file: src/bot/.env
    networks:
      - zima-network

  # Database
  db:
    image: postgres:15-alpine
    container_name: zima-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zima}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zima_password}
      POSTGRES_DB: ${POSTGRES_DB:-zima}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - zima-network

  # PGAdmin (optional)
  pgadmin:
    image: dpage/pgadmin4
    container_name: zima-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - zima-network

volumes:
  postgres_data:

networks:
  zima-network:
    driver: bridge
